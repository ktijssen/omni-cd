suite: PersistentVolumeClaim
templates:
  - pvc.yaml

tests:
  - it: Should create a PVC when persistence is enabled
    set:
      persistence.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omni-cd

  - it: Should not create a PVC when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Should set storage size
    set:
      persistence.enabled: true
      persistence.size: 5Gi
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi

  - it: Should set storageClass when provided
    set:
      persistence.enabled: true
      persistence.storageClass: fast-ssd
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd

  - it: Should set access mode
    set:
      persistence.enabled: true
      persistence.accessMode: ReadWriteOnce
    asserts:
      - contains:
          path: spec.accessModes
          content: ReadWriteOnce
