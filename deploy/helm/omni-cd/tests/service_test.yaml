suite: Service
templates:
  - service.yaml

tests:
  - it: Should create a Service
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omni-cd

  - it: Should default to ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: Should use LoadBalancer when set
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: Should expose the correct port
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: Should set service annotations
    set:
      service.annotations:
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    asserts:
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]
          value: "true"
