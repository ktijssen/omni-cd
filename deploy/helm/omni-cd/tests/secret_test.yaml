suite: Secret
templates:
  - secret.yaml

tests:
  - it: Should create a Secret by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omni-cd

  - it: Should not create a Secret when existingSecret is set
    set:
      existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: Should render config.yaml as a single key
    asserts:
      - exists:
          path: stringData["config.yaml"]

  - it: Should include omni credentials in config.yaml
    set:
      config.omni.endpoint: https://omni.example.com
      config.omni.serviceAccountKey: sa-key
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'endpoint: "https://omni.example.com"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'serviceAccountKey: "sa-key"'

  - it: Should include adminPassword in config.yaml
    set:
      config.adminPassword: s3cr3t
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'adminPassword: "s3cr3t"'

  - it: Should include webhookSecret in config.yaml
    set:
      config.webhookSecret: webhook-token
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'webhookSecret: "webhook-token"'

  - it: Should render OIDC block when enabled
    set:
      config.oidc.enabled: true
      config.oidc.issuerUrl: https://sso.example.com
      config.oidc.clientId: omni-cd
      config.oidc.clientSecret: oidc-secret
      config.oidc.adminGroups: "admins,sre"
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'oidc:'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'issuerUrl: "https://sso.example.com"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'clientSecret: "oidc-secret"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "admins"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "sre"'

  - it: Should omit OIDC block when disabled
    set:
      config.oidc.enabled: false
    asserts:
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: 'oidc:'

  - it: Should render repos block (with token) when provided
    set:
      config.repos:
        - name: prod
          url: https://github.com/example/prod.git
          branch: main
          clusters_path: clusters
          mc_path: mc
          token: ghp_secret
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'repos:'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'name: prod'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'token: ghp_secret'

  - it: Should render scalar fields with correct YAML types
    set:
      config.refreshInterval: "60"
      config.logRetentionDays: "14"
      config.logLevel: DEBUG
      config.authDisabled: "true"
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'refreshInterval: 60'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'logRetentionDays: 14'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'logLevel: "DEBUG"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'authDisabled: true'
