suite: Secret
templates:
  - secret.yaml

tests:
  - it: Should create a Secret by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omni-cd

  - it: Should not create a Secret when existingSecret is set
    set:
      existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: Should include OMNI_ENDPOINT in secret
    set:
      config.omni.endpoint: "https://omni.example.com"
    asserts:
      - equal:
          path: stringData.OMNI_ENDPOINT
          value: "https://omni.example.com"

  - it: Should include ADMIN_PASSWORD in secret
    set:
      config.adminPassword: "s3cr3t"
    asserts:
      - equal:
          path: stringData.ADMIN_PASSWORD
          value: "s3cr3t"

  - it: Should include WEBHOOK_SECRET when set
    set:
      config.webhookSecret: "webhook-token"
    asserts:
      - equal:
          path: stringData.WEBHOOK_SECRET
          value: "webhook-token"

  - it: Should not include WEBHOOK_SECRET when empty
    set:
      config.webhookSecret: ""
    asserts:
      - notExists:
          path: stringData.WEBHOOK_SECRET

  - it: Should include OIDC_CLIENT_SECRET when oidc is enabled
    set:
      config.oidc.enabled: true
      config.oidc.clientSecret: "oidc-secret"
    asserts:
      - equal:
          path: stringData.OIDC_CLIENT_SECRET
          value: "oidc-secret"

  - it: Should not include OIDC_CLIENT_SECRET when oidc is disabled
    set:
      config.oidc.enabled: false
    asserts:
      - notExists:
          path: stringData.OIDC_CLIENT_SECRET
