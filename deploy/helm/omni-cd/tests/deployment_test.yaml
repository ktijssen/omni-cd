suite: Deployment
templates:
  - deployment.yaml

tests:
  - it: Should create a Deployment
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omni-cd

  - it: Should use custom image tag
    set:
      image.tag: "1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/ktijssen/omni-cd:1.0.0

  - it: Should set replica count
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: Should pass --config-path arg to the container
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config-path=/config/config.yaml

  - it: Should append --config-path for each additionalConfigSource
    set:
      additionalConfigSources:
        - secret: omni-creds
        - configMap: feature-flags
          key: features.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config-path=/config/config.yaml
            - --config-path=/config/additional-0/config.yaml
            - --config-path=/config/additional-1/config.yaml

  - it: Should mount additionalConfigSources as Secret and ConfigMap volumes
    set:
      additionalConfigSources:
        - secret: omni-creds
        - configMap: feature-flags
          key: features.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: additional-0
            mountPath: /config/additional-0
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: additional-0
            secret:
              secretName: omni-creds
              items:
                - key: config.yaml
                  path: config.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: additional-1
            configMap:
              name: feature-flags
              items:
                - key: features.yaml
                  path: config.yaml

  - it: Should fail when additionalConfigSources entry has neither secret nor configMap
    set:
      additionalConfigSources:
        - key: config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "additionalConfigSources[0] must set either 'secret' or 'configMap'"

  - it: Should append free-form args after --config-path
    set:
      args:
        - --my-flag=value
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config-path=/config/config.yaml
            - "--my-flag=value"

  - it: Should mount the config Secret at /config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /config
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            secret:
              secretName: RELEASE-NAME-omni-cd

  - it: Should mount the existingSecret when set
    set:
      existingSecret: my-secret
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            secret:
              secretName: my-secret

  - it: Should not set env block by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: Should render env block when provided
    set:
      env:
        - name: HTTPS_PROXY
          value: http://proxy.example.com:8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://proxy.example.com:8080

  - it: Should not set envFrom block by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: Should render envFrom block when provided
    set:
      envFrom:
        - secretRef:
            name: extra-secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: extra-secrets

  - it: Should set default liveness and readiness probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5

  - it: Should override liveness probe from values
    set:
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 60
        periodSeconds: 15
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 60

  - it: Should omit probes when explicitly set to null/empty
    set:
      livenessProbe: ~
      readinessProbe: ~
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: Should mount data volume when persistence is enabled
    set:
      persistence.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: RELEASE-NAME-omni-cd

  - it: Should not mount data volume when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data

  - it: Should set pod annotations
    set:
      podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: Should set node selector
    set:
      nodeSelector:
        kubernetes.io/os: linux
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux
