image:
  repository: ghcr.io/ktijssen/omni-cd
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: omni-cd.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Gateway API HTTPRoute (alternative to ingress)
httpRoute:
  # -- Enable HTTPRoute resource
  enabled: false
  annotations: {}
  # -- Gateway parentRefs to attach to
  parentRefs:
    - name: default
      namespace: default
  # -- Hostnames to match
  hostnames:
    - omni-cd.example.com

# -- Application configuration
config:
  # -- How often (in seconds) to poll git for changes
  refreshInterval: "300"
  # -- Port the web UI listens on
  webPort: "8080"
  # -- Log level: DEBUG, INFO, WARN, ERROR
  logLevel: "INFO"
  # -- Number of days to retain logs
  logRetentionDays: "7"
  # -- Number of days to retain audit log files
  auditRetentionDays: "30"
  # -- Disable authentication (not recommended for production)
  authDisabled: "false"
  # -- Admin password (ignored when OIDC is enabled)
  adminPassword: ""
  # -- Optional secret for validating GitHub/GitLab webhook signatures
  webhookSecret: ""

  # -- Omni connection settings
  omni:
    # -- Omni API endpoint URL
    endpoint: ""
    # -- Service account key for authenticating with Omni
    serviceAccountKey: ""

  # -- OIDC / SSO configuration
  oidc:
    # -- Enable OIDC authentication
    enabled: false
    # -- OIDC provider issuer URL
    issuerUrl: ""
    # -- OIDC client ID
    clientId: ""
    # -- OIDC client secret (consider using existingSecret instead)
    clientSecret: ""
    # -- Redirect URL registered with the OIDC provider
    redirectUrl: ""
    # -- Space-separated list of scopes to request
    scopes: ""
    # -- JWT claim to use for group membership
    groupsClaim: ""
    # -- Groups granted admin access
    adminGroups: ""
    # -- Email addresses granted admin access
    adminEmails: ""
    # -- Groups granted viewer access
    viewerGroups: ""
    # -- Email addresses granted viewer access
    viewerEmails: ""
    # -- Default role when no group/email matches: admin or viewer
    defaultRole: ""
    # -- Skip TLS verification for the OIDC provider (not recommended)
    insecure: "false"

  # -- Optional initial repository list. Seeded into the config file on
  # -- first boot, then managed via the web UI. Tokens are allowed here
  # -- because the rendered config lives in a Kubernetes Secret.
  repos: []
  # - name: prod
  #   url: https://github.com/example/prod.git
  #   branch: main
  #   clusters_path: clusters
  #   mc_path: machineclasses
  #   token: ""

# -- Use an existing Secret instead of rendering one from these values.
# -- The Secret must contain a `config.yaml` key with the full omni-cd
# -- configuration; see deploy/config.example.yaml for the schema.
existingSecret: ""

# -- Additional config files layered on top of the main config.yaml. Each
# -- source is mounted under /config/additional-<index>/config.yaml and
# -- passed to the binary via --config-path. Later sources override earlier
# -- ones, so this is the supported way to inject an externally-managed
# -- subtree (e.g. omni credentials from an ExternalSecret). Lists like
# -- `repos:` are replaced when present in a layer.
additionalConfigSources: []
# - secret: omni-credentials      # name of a Secret
#   # key: config.yaml            # optional; default 'config.yaml'
# - configMap: feature-flags      # name of a ConfigMap
#   key: features.yaml

# -- Free-form extra arguments appended to the container command line after
# -- all --config-path flags.
args: []
# - --some-flag=value

metrics:
  enabled: false
  port: 9090
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: "30s"
    labels: {}
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

resources: {}

# -- Extra environment variables to inject into the container (advanced).
# -- Useful for proxy settings, debugging, or overriding individual config
# -- values (env vars take precedence over the YAML config file).
env: []
# - name: HTTPS_PROXY
#   value: http://proxy.example.com:8080

# -- envFrom sources (ConfigMaps / Secrets) mounted as env vars.
envFrom: []
# - secretRef:
#     name: extra-credentials

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}
