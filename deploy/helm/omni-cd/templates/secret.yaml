{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni-cd.fullname" . }}
  labels:
    {{- include "omni-cd.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    omni:
      endpoint: {{ .Values.config.omni.endpoint | quote }}
      serviceAccountKey: {{ .Values.config.omni.serviceAccountKey | quote }}
    refreshInterval: {{ .Values.config.refreshInterval }}
    webPort: {{ .Values.config.webPort | quote }}
    metricsPort: {{ .Values.metrics.port | quote }}
    webhookSecret: {{ .Values.config.webhookSecret | quote }}
    adminPassword: {{ .Values.config.adminPassword | quote }}
    authDisabled: {{ .Values.config.authDisabled }}
    logLevel: {{ .Values.config.logLevel | quote }}
    logRetentionDays: {{ .Values.config.logRetentionDays }}
    auditRetentionDays: {{ .Values.config.auditRetentionDays }}
    {{- if .Values.config.oidc.enabled }}
    oidc:
      enabled: true
      issuerUrl: {{ .Values.config.oidc.issuerUrl | quote }}
      clientId: {{ .Values.config.oidc.clientId | quote }}
      clientSecret: {{ .Values.config.oidc.clientSecret | quote }}
      redirectUrl: {{ .Values.config.oidc.redirectUrl | quote }}
      groupsClaim: {{ .Values.config.oidc.groupsClaim | quote }}
      defaultRole: {{ .Values.config.oidc.defaultRole | quote }}
      insecure: {{ .Values.config.oidc.insecure }}
      {{- with .Values.config.oidc.scopes }}
      scopes:
        {{- range splitList "," . }}
        - {{ . | trim | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.config.oidc.adminGroups }}
      adminGroups:
        {{- range splitList "," . }}
        - {{ . | trim | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.config.oidc.adminEmails }}
      adminEmails:
        {{- range splitList "," . }}
        - {{ . | trim | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.config.oidc.viewerGroups }}
      viewerGroups:
        {{- range splitList "," . }}
        - {{ . | trim | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.config.oidc.viewerEmails }}
      viewerEmails:
        {{- range splitList "," . }}
        - {{ . | trim | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with .Values.config.repos }}
    repos:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
