apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omni-cd.fullname" . }}
  labels:
    {{- include "omni-cd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "omni-cd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omni-cd.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: omni-cd
          image: "{{ .Values.image.repository }}:{{ include "omni-cd.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config-path=/config/config.yaml
            {{- range $index, $source := .Values.additionalConfigSources }}
            - --config-path=/config/additional-{{ $index }}/config.yaml
            {{- end }}
            {{- range .Values.args }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- range $index, $source := .Values.additionalConfigSources }}
            - name: additional-{{ $index }}
              mountPath: /config/additional-{{ $index }}
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.existingSecret | default (include "omni-cd.fullname" .) }}
        {{- range $index, $source := .Values.additionalConfigSources }}
        - name: additional-{{ $index }}
          {{- if $source.secret }}
          secret:
            secretName: {{ $source.secret }}
            items:
              - key: {{ $source.key | default "config.yaml" }}
                path: config.yaml
          {{- else if $source.configMap }}
          configMap:
            name: {{ $source.configMap }}
            items:
              - key: {{ $source.key | default "config.yaml" }}
                path: config.yaml
          {{- else }}
          {{- fail (printf "additionalConfigSources[%d] must set either 'secret' or 'configMap'" $index) }}
          {{- end }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "omni-cd.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
