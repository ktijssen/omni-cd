services:
  omni-cd:
    build:
      context: ../../.
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    command: ["--config-path=/config/config.yaml"]
    # Keep these in sync with webPort / metricsPort in config.yaml.
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
