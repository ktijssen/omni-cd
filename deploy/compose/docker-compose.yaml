services:
  omni-cd:
    build:
      context: ../../.
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      - OMNI_ENDPOINT=${OMNI_ENDPOINT}
      - OMNI_SERVICE_ACCOUNT_KEY=${OMNI_SERVICE_ACCOUNT_KEY}
      - REFRESH_INTERVAL=${REFRESH_INTERVAL:-300}
      - WEB_PORT=${WEB_PORT:-8080}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL}
      - OIDC_SCOPES=${OIDC_SCOPES}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM}
      - OIDC_ADMIN_GROUPS=${OIDC_ADMIN_GROUPS}
      - OIDC_ADMIN_EMAILS=${OIDC_ADMIN_EMAILS}
      - OIDC_VIEWER_GROUPS=${OIDC_VIEWER_GROUPS}
      - OIDC_VIEWER_EMAILS=${OIDC_VIEWER_EMAILS}
      - OIDC_DEFAULT_ROLE=${OIDC_DEFAULT_ROLE}
      - OIDC_INSECURE=${OIDC_INSECURE:-false}
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:$$WEB_PORT/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
