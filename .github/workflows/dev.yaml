name: Dev Build

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    # beta/* is handled by beta.yaml, release/* by release.yaml. Everything else
    # merged into main gets a dev image and nothing else — no chart, no release.
    if: |
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'beta/') &&
      !startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit this merge produced on main, not refs/pull/N/merge.
          # git describe has to count from main's history for the build number
          # to line up, and the sha in the tag should be the one on main.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Compute dev version
        id: version
        run: |
          if ! VERSION="$(git describe --tags --abbrev=7 --match 'v[0-9]*')"; then
            echo "::error::No v* tag found — cannot derive a dev version"
            exit 1
          fi
          # Sitting exactly on a release tag means describe returns a bare version
          # like 'v0.5.0', which would overwrite that release image. Shouldn't
          # happen (release/* merges are excluded above), but never push over it.
          if [[ ! "$VERSION" =~ -[0-9]+-g[0-9a-f]+$ ]]; then
            echo "::error::'$VERSION' is a release tag, not a dev version — refusing to push"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Dev version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          # No cache-to: this only ever runs on a closed PR, so the cache would be
          # written to that PR's ref scope and never read by anything again.
          cache-from: type=gha
