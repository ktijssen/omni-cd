name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'hack/VERSION'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git

      - name: Run Helm unit tests
        run: helm unittest deploy/helm/omni-cd

  release:
    runs-on: ubuntu-latest
    needs: helm-test
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat hack/VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version from file: $VERSION"

      - name: Check if version already released
        id: check
        run: |
          if git tag --list | grep -qx "${{ steps.version.outputs.version }}"; then
            echo "Tag ${{ steps.version.outputs.version }} already exists — skipping release."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Omni CD ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Omni CD ${{ steps.version.outputs.version }}

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            ### Docker Compose Quick Start
            ```bash
            docker run -d \
              -e OMNI_ENDPOINT=https://your-omni.example.com \
              -e OMNI_SERVICE_ACCOUNT_KEY=your-key \
              -e ADMIN_PASSWORD=changeme \
              -p 8080:8080 \
              ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

          draft: false
          prerelease: false
