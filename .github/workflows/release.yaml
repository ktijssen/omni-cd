name: Build and Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'hack/VERSION'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  helm-test:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install helm-unittest plugin
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest.git

      - name: Run Helm unit tests
        run: helm unittest deploy/helm/omni-cd

  release:
    runs-on: ubuntu-latest
    needs: helm-test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat hack/VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version from file: $VERSION"

      - name: Check if version already released
        id: check
        run: |
          if git tag --list | grep -qx "${{ steps.version.outputs.version }}"; then
            echo "Tag ${{ steps.version.outputs.version }} already exists — skipping release."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        if: steps.check.outputs.skip == 'false'
        uses: azure/setup-helm@v5

      - name: Resolve chart version
        if: steps.check.outputs.skip == 'false'
        id: chart
        run: |
          echo "chart_version=${VERSION#v}" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package Helm chart
        if: steps.check.outputs.skip == 'false'
        run: helm package deploy/helm/omni-cd --destination .

      - name: Log in to GHCR for Helm
        if: steps.check.outputs.skip == 'false'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to OCI registry
        if: steps.check.outputs.skip == 'false'
        run: |
          helm push omni-cd-${{ steps.chart.outputs.chart_version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Omni CD ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Omni CD ${{ steps.version.outputs.version }}

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            ### Helm (OCI)
            ```bash
            helm install omni-cd oci://ghcr.io/${{ github.repository_owner }}/charts/omni-cd \
              --version ${{ steps.chart.outputs.chart_version }} \
              --namespace omni-cd --create-namespace
            ```

          draft: false
          prerelease: false
