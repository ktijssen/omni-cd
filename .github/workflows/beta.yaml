name: Beta Build

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  helm-test:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'beta/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install helm-unittest plugin
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest.git

      - name: Run Helm unit tests
        run: helm unittest deploy/helm/omni-cd

  beta:
    runs-on: ubuntu-latest
    needs: helm-test
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'beta/')
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract beta version from branch name
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${HEAD_REF#beta/}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.0-beta\.[0-9]+$ ]]; then
            echo "::error::Branch name '$HEAD_REF' must match 'beta/v<MAJOR>.<MINOR>.0-beta.<N>' (e.g. beta/v0.4.0-beta.1)"
            exit 1
          fi
          CHART_VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "chart_version=$CHART_VERSION" >> $GITHUB_OUTPUT
          echo "Beta version: $VERSION (chart $CHART_VERSION)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:beta
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Sync Chart.yaml version for this beta
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          sed -i "s/^version:.*/version: $CHART_VERSION/" deploy/helm/omni-cd/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: $APP_VERSION/" deploy/helm/omni-cd/Chart.yaml

      - name: Package Helm chart
        run: helm package deploy/helm/omni-cd --destination .

      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to OCI registry
        run: |
          helm push omni-cd-${{ steps.version.outputs.chart_version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts
