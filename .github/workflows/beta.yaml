name: Beta Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'hack/VERSION'
      - 'deploy/**'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute beta version
        id: version
        run: |
          # Read current version and strip patch, append -beta-gSHA
          VERSION=$(cat hack/VERSION | tr -d '[:space:]')
          # Extract major.minor (strip leading v and patch segment)
          MAJOR_MINOR=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f1,2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BETA_VERSION="v${MAJOR_MINOR}.0-beta-g${SHORT_SHA}"
          echo "version=$BETA_VERSION" >> $GITHUB_OUTPUT
          echo "Beta version: $BETA_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:beta
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
