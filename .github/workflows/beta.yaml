name: Beta Build

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  helm-test:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'beta/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install helm-unittest plugin
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest.git

      - name: Run Helm unit tests
        run: helm unittest deploy/helm/omni-cd

  beta:
    runs-on: ubuntu-latest
    needs: helm-test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'beta/'))
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute beta version
        id: version
        run: |
          # Read current version and strip patch, append -beta-gSHA
          VERSION=$(cat hack/VERSION | tr -d '[:space:]')
          # Extract major.minor (strip leading v and patch segment)
          MAJOR_MINOR=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f1,2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BETA_VERSION="v${MAJOR_MINOR}.0-beta-g${SHORT_SHA}"
          echo "version=$BETA_VERSION" >> $GITHUB_OUTPUT
          echo "Beta version: $BETA_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:beta
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Sync Chart.yaml version
        id: chart
        run: |
          APP_VERSION="${{ steps.version.outputs.version }}"
          CHART_VERSION="${APP_VERSION#v}"
          sed -i "s/^version:.*/version: $CHART_VERSION/" deploy/helm/omni-cd/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: $APP_VERSION/" deploy/helm/omni-cd/Chart.yaml
          echo "chart_version=$CHART_VERSION" >> $GITHUB_OUTPUT

      - name: Package Helm chart
        run: helm package deploy/helm/omni-cd --destination .

      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to OCI registry
        run: |
          helm push omni-cd-${{ steps.chart.outputs.chart_version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts
